<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/icons/fontawesome-free-7.2.0-web/css/all.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="/script/script.js"></script>
    <title>Escalas de Temperatura</title>
</head>

<body>
    <main>
        <section id="secaocentralizada" class="secaocentralizada">
            <div id="cardtitulos" class="cardtitulos">
                <i class="fa-solid fa-temperature-empty" id="iconetemperature"></i>
                <h1 id="titulo" class="titulo">Calculadora de Temperatura</h1>
                <span id="subtitulo" class="subtitulo">Converta entre Celsius, Fahrenheit e Kelvin de forma rápido e
                    fácil.</span>
            </div>
            <div id="fundointerno" class="fundointerno">
                <div id="fundointerno1" class="fundointerno1">
                    <div id="valores" class="valores">
                        <form id="formulariovalores" class="formulariovalores">
                            <p id="textoform" class="textform">Convertendo de:</p>
                            <input type="number" id="inputtemperatura" class="inputtemperatura"
                                placeholder="Digite a temperatura">
                            <p id="textform1" class="textform">Para:</p>
                            <select name="escaladetemperatura" id="escaladetemperatura" class="escaladetemperatura">
                                <option value="celsius" selected>Celsius</option>
                                <option value="fahrenheit">Fahrenheit</option>
                                <option value="kelvin">Kelvin</option>
                            </select>
                            <button type="button" id="botao" class="botao" onclick="calcularTemperatura(); limparInputs()"><i
                                    class="fa-solid fa-arrow-right-arrow-left"></i>Converter</button>
                        </form>
                        <div id="informacaoformula" class="informacaoformula">
                            <div id="informacaoicon" class="informacaoicon">
                                <i class="fa-solid fa-circle-info"></i>
                            </div>
                            <div id="formulatextos" class="formulatextos">
                                <span id="formulautilizada" class="formulautilizada"></span>
                                <span id="formula" class="formula"></span>
                            </div>

                        </div>
                    </div>
                    <div id="resultado" class="resultado">
                        <div id="resultadocontainer" class="resultadocontainer">
                            <i class="fa-solid fa-square-poll-vertical" id="iconresultado"></i>
                            <h2>Resultado</h2>
                        </div>
                        <h1 id="temperatura" class="temperatura"></h1>
                        <div id="resultadoescala" class="resultadoescala">
                            <div id="escala" class="escala">
                                <p id="valorconvertidocontainer1" class="valorconvertidocontainer1"></p>
                            </div>
                            <div id="escala1" class="escala">
                                <p id="valorconvertidocontainer2" class="valorconvertidocontainer2"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="rodape" class="rodape">
                    <i class="fa-solid fa-shield" id="escudo"></i>
                    <p>Conversões precisas para o seu dia a dia.</p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
